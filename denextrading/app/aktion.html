<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passwort zurücksetzen – Denex Trading</title><meta name="robots" content="noindex"><meta name="theme-color" content="#0c1320">
<link rel="icon" href="icons/favicon-32.png"><link rel="stylesheet" href="css/app.css"></head>
<body>
<div class="onb" id="box">
  <img src="icons/icon-192.png" alt="" width="72" height="72" style="border-radius:18px">
  <h1>Denex Trading</h1>
  <div class="empty" id="msg">Link wird geprüft …</div>
</div>
<script src="config.js"></script>
<script type="module">
  import * as cloud from "./js/cloud.js";
  const q = new URLSearchParams(location.search), box = document.getElementById("box");
  const mode = q.get("mode"), code = q.get("oobCode");
  // Rücksprung nur auf die eigene Seite (keine fremden oder javascript:-Links)
  const app = (() => { try { const u = new URL(q.get("continueUrl") || "./", location.href); return u.origin === location.origin ? u.href : "./"; } catch (e) { return "./"; } })();
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const show = html => { box.querySelector("#msg")?.remove(); box.querySelector("#content")?.remove(); box.insertAdjacentHTML("beforeend", `<div id="content" class="form">${html}</div>`); };
  const fail = text => show(`<div class="err">${esc(text)}</div><a class="primary" href="./" style="text-align:center;text-decoration:none">Zur App</a>`);
  if (mode !== "resetPassword" || !code) fail("Dieser Link ist unvollständig. Bitte öffne ihn direkt aus der E-Mail.");
  else cloud.checkResetCode(code).then(email => {
    show(`<p class="lead">Neues Passwort für <strong>${esc(email)}</strong></p>
      <form id="f" class="form" autocomplete="on">
        <input type="email" value="${esc(email)}" autocomplete="username" hidden>
        <div class="group">
          <div class="field"><label for="p1">Neues Passwort</label><input id="p1" type="password" autocomplete="new-password" minlength="6" required></div>
          <div class="field"><label for="p2">Wiederholen</label><input id="p2" type="password" autocomplete="new-password" minlength="6" required></div></div>
        <p class="hint">Mindestens 6 Zeichen.</p>
        <button class="primary" id="go" type="submit">Passwort speichern</button><div id="err"></div></form>`);
    document.getElementById("f").onsubmit = async e => {
      e.preventDefault();
      const p1 = document.getElementById("p1").value, p2 = document.getElementById("p2").value, err = document.getElementById("err"), go = document.getElementById("go");
      if (p1 !== p2) { err.innerHTML = '<div class="err">Die Passwörter stimmen nicht überein.</div>'; return; }
      go.disabled = true; go.textContent = "Wird gespeichert …"; err.innerHTML = "";
      try {
        await cloud.confirmReset(code, p1);
        show(`<div class="banner" style="border-style:solid">✓ Dein Passwort wurde geändert. Du kannst dich jetzt mit dem neuen Passwort anmelden.</div>
          <a class="primary" href="${esc(app)}" style="text-align:center;text-decoration:none">Zur Anmeldung</a>`);
      } catch (x) { err.innerHTML = `<div class="err">${esc(cloud.message(x))}</div>`; go.disabled = false; go.textContent = "Passwort speichern"; }
    };
  }, x => fail(cloud.message(x)));
</script>
</body></html>

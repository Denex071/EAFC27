<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FC Trader</title>
<meta name="theme-color" content="#0c1320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FC Trader">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="root"></div>
<div id="layer"></div>
<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
<script>
  // Zoomen verhindern (iOS ignoriert user-scalable=no): Zwei-Finger-Gesten abfangen, Doppeltippen verhindert touch-action im CSS
  const stop = e => e.preventDefault();
  ["gesturestart", "gesturechange", "gestureend"].forEach(t => window.addEventListener(t, stop, { passive: false, capture: true }));
  ["touchstart", "touchmove"].forEach(t => window.addEventListener(t, e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false, capture: true }));
  // Falls doch gezoomt wurde (z. B. Safari-Tab): sofort auf 100 % zurückspringen
  const vp = document.querySelector('meta[name="viewport"]'), vpContent = vp.content;
  window.visualViewport?.addEventListener("resize", () => {
    if (visualViewport.scale > 1.01) { vp.content = vpContent + ", width=device-width"; setTimeout(() => { vp.content = vpContent; }, 50); }
  });
  // Zahlenfelder (EK, VK, Rating …): beim Antippen den ganzen Wert markieren → einfach überschreiben
  document.addEventListener("focusin", e => {
    const el = e.target;
    if (!el.matches?.('input[inputmode="decimal"], input[inputmode="numeric"]')) return;
    setTimeout(() => { try { el.setSelectionRange(0, el.value.length); } catch (x) { el.select(); } }, 0);
    // Desktop: das anschließende Loslassen der Maus nicht die Markierung aufheben lassen
    el.addEventListener("mouseup", ev => ev.preventDefault(), { once: true });
  });
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
